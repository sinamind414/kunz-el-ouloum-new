name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check-v2:
    name: "check:v2 (noyau méthodologique)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:v2

  boussole-tests:
    name: "test (harnais natif, 102 invariants)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  vitest:
    name: "test:vitest (fiche + gate + scorer v2)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:vitest
